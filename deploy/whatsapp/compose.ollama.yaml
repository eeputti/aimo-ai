# Use with compose.yaml. Ollama has no published host port.
services:
  whatsapp:
    environment:
      AIMO_MODEL_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-32768}
      ANTHROPIC_API_KEY: ""
      WHATSAPP_TRANSCRIBE: none
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  ollama-models:

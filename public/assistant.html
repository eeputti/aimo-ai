<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valio Aimo – Tilausapuri</title>
  <link rel="stylesheet" href="/aimo-shell.css">
  <link rel="stylesheet" href="/assistant.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23005670'/%3E%3Cpath d='M9 22 16 9l7 13h-3.4l-1.2-2.5h-4.8L12.4 22z' fill='%23c0e021'/%3E%3C/svg%3E">
</head>
<body>
  <script src="/aimo-shell.js" data-page="assistant"></script>

  <main class="ta">
    <header class="ta-head">
      <h1>Tilausapuri</h1>
      <p>Kirjoita mitä tarvitset ja mihin päivään. Saat aikaisimman toimituspäivän, tilauksen takarajan, hinnan ja korvaavat tuotteet, jos tuotetta ei saa ajoissa.</p>
    </header>

    <p class="ta-notice" id="ta-notice" hidden></p>

    <section class="ta-log" id="ta-log" aria-live="polite"></section>

    <div class="ta-examples" id="ta-examples">
      <button type="button">10 l rasvatonta maitoa ja 5 kg voita maanantaiksi</button>
      <button type="button">20 l laktoositonta kuohukermaa perjantaiksi</button>
      <button type="button">12 l kaurajuomaa ja 3 kg emmentalia huomiseksi</button>
    </div>

    <form class="ta-form" id="ta-form" autocomplete="off">
      <textarea id="ta-input" rows="2" placeholder="Esim. 10 l rasvatonta maitoa maanantaiksi" aria-label="Tilaustarve"></textarea>
      <button type="submit" id="ta-send">Lähetä</button>
    </form>
    <p class="ta-foot">Hinnat ja saatavuus tulevat Valio Aimon rajapinnasta. Tarkista korvaavien tuotteiden allergeenit ennen tilausta.</p>
  </main>

  <script src="/assistant.js"></script>
</body>
</html>

<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aimo AI – tilaus valmiina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Sofia+Sans+Extra+Condensed:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/aimo-shell.css">
  <link rel="stylesheet" href="/kitchen-viz.css">
  <link rel="stylesheet" href="/mode.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23005670'/%3E%3Cpath d='M9 22 16 9l7 13h-3.4l-1.2-2.5h-4.8L12.4 22z' fill='%23c0e021'/%3E%3C/svg%3E">
</head>
<body>
  <script src="/aimo-shell.js" data-page="kitchen"></script>

  <div class="layout">
    <main id="main">
      <section class="mode" id="ordermode" aria-live="polite" hidden></section>
      <section class="hero" id="hero"></section>
      <section id="decisions"></section>
      <section id="lines"></section>
      <section id="skipped"></section>
    </main>

    <aside class="rail">
      <section class="panel assistant">
        <div class="panel-head">
          <h2>Kerro, mitä muutetaan</h2>
          <span class="path-tag fast">Nopea polku</span>
        </div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="chips" id="chips"></div>
        <form class="composer" id="composer" autocomplete="off">
          <button type="button" class="mic" id="mic" title="Sanele" aria-label="Sanele">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <input id="input" type="text" placeholder="Esim. sama kuin viime viikolla, mutta 20 % enemmän kermaa" aria-label="Viesti agentille">
          <button type="submit" class="send" aria-label="Lähetä">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </section>

      <section class="panel">
        <div class="tabs" role="tablist">
          <button role="tab" data-action="tab" data-tab="rules">Säännöt</button>
          <button role="tab" data-action="tab" data-tab="audit">Loki</button>
          <button role="tab" data-action="tab" data-tab="how">Näin tämä toimii</button>
        </div>
        <div id="tabbody"></div>
      </section>
    </aside>
  </div>

  <footer class="bar" id="bar"></footer>
  <dialog id="review" class="review"></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="/app.js"></script>
  <script type="module" src="/mode.js"></script>
</body>
</html>

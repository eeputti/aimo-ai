<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valio Aimo Tilausapuri</title>
<style>
  :root { --petrol: #005670; --lilac: #ece6f3; --bubble: #d9f2e4; --ink: #0f2a33; --muted: #6b797d; --line: #dfe6e9; --ok: #1a7f37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--lilac); display: grid; place-items: center; }
  .phone { width: min(440px, 100vw); height: min(860px, 100dvh); background: #f4f1ea; display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 480px) { .phone { border-radius: 28px; box-shadow: 0 18px 60px rgba(0, 86, 112, .28); border: 8px solid #10242b; } }
  header { background: var(--petrol); color: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--petrol); display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
  header b { display: block; font-size: 16px; }
  header small { opacity: .8; font-size: 12px; }
  header button { margin-left: auto; background: none; border: 0; color: #fff; padding: 8px; border-radius: 50%; cursor: pointer; }
  header button:hover { background: rgba(255, 255, 255, .15); }
  .log { flex: 1; overflow-y: auto; padding: 14px 12px 6px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 8px 11px 6px; border-radius: 12px; font-size: 14.5px; line-height: 1.38; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgba(0, 0, 0, .08); }
  .msg.in { background: #fff; align-self: flex-start; border-top-left-radius: 3px; }
  .msg.out { background: var(--bubble); align-self: flex-end; border-top-right-radius: 3px; }
  .msg.ordered { border-left: 4px solid var(--ok); }
  .msg.fail { background: #fff4d6; }
  .msg time { display: block; text-align: right; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .typing { align-self: flex-start; background: #fff; border-radius: 12px; padding: 12px 14px; display: flex; gap: 5px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }
  .chips { display: flex; gap: 8px; padding: 6px 12px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid var(--petrol); background: #fff; color: var(--petrol); border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chips button:hover { background: var(--lilac); }
  form { display: flex; gap: 8px; padding: 8px 10px 12px; }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; font: inherit; font-size: 15px; height: 42px; max-height: 120px; outline: none; }
  textarea:focus { border-color: var(--petrol); }
  form button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--petrol); color: #fff; cursor: pointer; flex: none; display: grid; place-items: center; }
  form button:disabled { opacity: .45; cursor: default; }
  .note { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 4px; }
</style>
</head>
<body>
<main class="phone">
  <header>
    <div class="avatar" aria-hidden="true">aimo</div>
    <div><b>Valio Aimo Tilausapuri</b><small>Demo, oikeaa tilausta ei lähetetä</small></div>
    <button type="button" id="reset" title="Aloita alusta" aria-label="Aloita alusta">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>
  <section class="log" id="log" aria-live="polite"></section>
  <div class="chips" id="chips"></div>
  <form id="form">
    <textarea id="text" placeholder="Kirjoita viesti" aria-label="Viesti" rows="1"></textarea>
    <button type="submit" id="send" aria-label="Lähetä">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5v6.6L15 12 3 13.9z"/></svg>
    </button>
  </form>
</main>
<script>
  const log = document.getElementById('log'); const form = document.getElementById('form');
  const input = document.getElementById('text'); const sendBtn = document.getElementById('send'); const chips = document.getElementById('chips');
  const START = ['20 l maitoa ja 5 l kermaa maanantaiksi', '100 kananmunaa ja 10 kg voita maanantaiksi', 'nyt tarvii 1000 litraa maitoo ku on juhlat maanantaina'];
  // Pikavastaukset seuraavat keskustelun tilaa. Ne vain täyttävät viestin: sama teksti kulkee kuin käsin kirjoitettuna.
  const NEXT = { collecting: ['ei allergioita', 'laktoositon', 'maanantaiksi'], choosing: ['1', '1 1', '2 1'], ready: ['TILAA', 'maitoa 30 litraa', 'näytä'], confirmed: START, pending_approval: START };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rich = (s) => esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
  const clock = () => new Date().toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
  let busy = false;

  function bubble(text, side, extra = '', meta = '') {
    const el = document.createElement('div');
    el.className = `msg ${side} ${extra}`.trim();
    el.innerHTML = `${rich(text)}<time>${clock()}${meta ? `, ${esc(meta)}` : ''}</time>`;
    log.append(el); log.scrollTop = log.scrollHeight;
    return el;
  }
  function setChips(list) {
    chips.replaceChildren(...list.map((t) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.onclick = () => send(t); return b; }));
  }
  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true; input.value = ''; input.style.height = '';
    bubble(text, 'out');
    const typing = document.createElement('div'); typing.className = 'typing'; typing.innerHTML = '<i></i><i></i><i></i>';
    log.append(typing); log.scrollTop = log.scrollHeight;
    try {
      const res = await fetch('/demo/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) });
      const data = await res.json();
      typing.remove();
      if (!res.ok) bubble(data.error || 'Viestin käsittely ei onnistunut.', 'in', 'fail');
      else {
        bubble(data.text, 'in', data.status === 'confirmed' || data.status === 'pending_approval' ? 'ordered' : '', `${(data.ms / 1000).toFixed(1).replace('.', ',')} s`);
        setChips(NEXT[data.status] || START);
      }
    } catch {
      typing.remove(); bubble('Yhteys palvelimeen katkesi. Viestiä ei käsitelty.', 'in', 'fail');
    } finally { busy = false; sendBtn.disabled = false; input.focus(); }
  }
  form.addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); } });
  input.addEventListener('input', () => { input.style.height = ''; input.style.height = `${Math.min(input.scrollHeight, 120)}px`; });
  document.getElementById('reset').addEventListener('click', async () => { if (busy) return; log.replaceChildren(); await send('peru'); setChips(START); });
  setChips(START); input.focus();
</script>
</body>
</html>
